# The pipeline's environment, shared by `process` (the CLI) and `scheduler`
# (the same code served as a Prefect flow) so the two cannot drift.
x-process-env: &process-env
  # Python/uv
  UV_CACHE_DIR: /tmp/uv-cache
  UV_NO_SYNC: "1"
  # SSH to the API machine via `cloudflared access ssh` as a ProxyCommand
  # (see process/SSC/sync.py) — service-token auth, no tunnel container.
  API_SSH_HOST: ${API_SSH_HOST:-ssh.cioospacificlabs.ca}
  API_SSH_USER: ${API_SSH_USER:-cioos}
  API_SSH_KEY_PATH: ${API_SSH_KEY_PATH:-/run/secrets/ONC_OA_rsync}
  API_SSH_KNOWN_HOSTS: ${API_SSH_KNOWN_HOSTS:-/run/secrets/known_hosts}
  CF_TOKEN_ID: ${CF_TOKEN_ID:-}
  CF_TOKEN_SECRET: ${CF_TOKEN_SECRET:-}
  # SSC pipeline: local ClickHouse (db-ch service) for status tracking
  CH_HOST: ${CH_HOST:-localhost}
  CH_PORT: ${CH_PORT:-8123}
  CH_USER: ${CH_USER:-default}
  CH_PASSWORD: ${CH_PASSWORD:-}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
  # SSC pipeline: local processing output dirs on this machine
  SSC_NC_DIR: ${SSC_NC_DIR:-/opt/data/SSC/nc}
  SSC_IMAGE_DIR: ${SSC_IMAGE_DIR:-/opt/data/SSC/images}
  SSC_SYNC_STAGING_DIR: ${SSC_SYNC_STAGING_DIR:-/opt/data/SalishSeaCast/sync_staging}
  # SSC sync stage: push finished dates' hourly rows + images to the API machine
  SYNC_API_DATA_DIR: ${SYNC_API_DATA_DIR:-}
  SYNC_API_BASE_URL: ${SYNC_API_BASE_URL:-}
  SYNC_API_TOKEN: ${SYNC_API_TOKEN:-}

x-process: &process
  build:
    context: .
    dockerfile: process/Dockerfile
  user: "${UID:-1000}:${GID:-1000}"
  profiles: ["tools"]
  environment: *process-env
  volumes:
    - ./shared:/app/shared
    - ./data:/opt/data
    - ./secrets:/run/secrets:ro
  depends_on:
    db-ch:
      condition: service_started
  network_mode: "host"
  restart: unless-stopped

services:
  # Local ClickHouse for the SSC pipeline's own status tracking
  # (SalishSeaCast_status) on this machine — only the finished hourly data +
  # images get pushed home via the `sync` stage ("process locally, network
  # only at the end").
  db-ch:
    image: clickhouse/clickhouse-server:latest
    # Also `cli`: `run process` enables only process's own profile, and a
    # dependency outside every active profile is "no such service".
    profiles: ["tools", "cli"]
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse/data:/var/lib/clickhouse
      - ./clickhouse/logs:/var/log/clickhouse-server
    environment:
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
    restart: unless-stopped

  # The CLI, run on demand — scheduled runs belong to `scheduler`:
  #   docker compose -f docker-compose.prod.process.yml run --rm process \
  #     uv run python -m SSC.cli status
  # Its own `cli` profile keeps `--profile tools up -d` from starting it (the
  # image's default `python3` exits at once without a TTY and restart-loops);
  # naming it in `run` enables the profile. `run` also always uses the current
  # image, where a long-lived container would keep the pre-rebuild one.
  process:
    <<: *process
    profiles: ["cli"]
    restart: "no"

  # --- Prefect: schedule + run-history UI for the SSC pipeline's `run` ------
  # `scheduler` reports to the shared, always-on Prefect server named by
  # PREFECT_API_URL (e.g. https://prefect.cioospacific.ca/api), with
  # PREFECT_AUTH_STRING for its basic auth. No local server: the server is
  # what hands out scheduled runs, so it lives somewhere that never sleeps. It
  # must run Prefect >= the `prefect==` pin in process/pyproject.toml.
  # The same image as `process`, serving SSC/flows.py instead of idling.
  # Stopping it pauses the schedule; starting it re-applies RUN_SCHEDULE_PAUSED
  # — so the UI's pause toggle lasts only until the next restart. Replaces any
  # host cron running `SSC.cli run`: keep only one, or the two overlap.
  scheduler:
    <<: *process
    command: ["uv", "run", "--no-sync", "python", "-m", "SSC.flows"]
    environment:
      <<: *process-env
      # Required, no default: a fallback URL turns a missing --env-file into
      # a restart loop of opaque "All connection attempts failed" errors.
      PREFECT_API_URL: ${PREFECT_API_URL:?set PREFECT_API_URL (e.g. https://prefect.cioospacific.ca/api) — did you pass --env-file?}
      # The server's basic auth (user:password). Blank sends none.
      PREFECT_API_AUTH_STRING: ${PREFECT_AUTH_STRING:-}
      PREFECT_LOGGING_EXTRA_LOGGERS: SalishSeaCast,nc2tile
      # The container runs as the host UID, whose home isn't writable here, so
      # the default ~/.prefect would fail.
      PREFECT_HOME: /tmp/prefect
      RUN_CRON: ${RUN_CRON:-0 */3 * * *}
      RUN_SCHEDULE_PAUSED: ${RUN_SCHEDULE_PAUSED:-false}
      RUN_LIMIT: ${RUN_LIMIT:-10}
      # What the old host cron passed (`SSC.cli run --workers 30`).
      RUN_WORKERS: ${RUN_WORKERS:-30}
    depends_on:
      db-ch:
        condition: service_started
