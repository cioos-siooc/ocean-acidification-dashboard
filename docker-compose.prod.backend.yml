services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./shared:/app/shared
      - ./data:/opt/data
      - /media/taimaz/OA/allDepths:/opt/archive
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=5432 # default Postgres port inside the Docker network
      - DB_NAME=oa
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - SSC_NC_DIR=${SSC_NC_DIR:-/opt/data/SSC/nc}
      - SSC_NC_DIR_ARCHIVE=${SSC_NC_DIR_ARCHIVE:-/opt/archive/SSC/nc}
      - SSC_IMAGE_DIR=${SSC_IMAGE_DIR:-/opt/data/SSC/images}
      - SSC_IMAGE_DIR_ARCHIVE=${SSC_IMAGE_DIR_ARCHIVE:-/opt/archive/SSC/images}
      - SSC_CLIM_DIR=${SSC_CLIM_DIR:-/opt/data/SSC/climatology}
      - LO_NC_DIR=${LO_NC_DIR:-/opt/data/LO/nc}
      - LO_IMAGE_DIR=${LO_IMAGE_DIR:-/opt/data/LO/images}
      - EVAL_DATA_DIR=${EVAL_DATA_DIR:-/opt/data/eval}
      # ClickHouse: local docker-compose instance (db-ch service) by default
      - CH_HOST=${CH_HOST:-db-ch}
      - CH_PORT=${CH_PORT:-8123}
      - CH_USER=${CH_USER:-default}
      - CH_PASSWORD=${CH_PASSWORD:-}
      # Set CH_USE_REMOTE=true and CH_REMOTE_URL to query a remote ClickHouse instead
      - CH_USE_REMOTE=${CH_USE_REMOTE:-false}
      - CH_REMOTE_URL=${CH_REMOTE_URL:-}
      - CH_REMOTE_USER=${CH_REMOTE_USER:-}
      - CH_REMOTE_PASSWORD=${CH_REMOTE_PASSWORD:-}
    depends_on:
      - db
      - db-ch
    restart: unless-stopped

  db:
    image: postgis/postgis:16-master
    environment:
      - POSTGRES_DB=oa
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - oa_db:/var/lib/postgresql/data
      # - ./DB:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db-ch:
    build:
      context: .
      dockerfile: clickhouse_test/Dockerfile
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      # - ./clickhouse_data:/var/lib/clickhouse
      # - ./clickhouse_logs:/var/log/clickhouse-server
      # - ./data:/app/data
      - /home/cioos/clickhouse_data:/var/lib/clickhouse
      # - ./scripts:/app/scripts
      # - ./clickhouse-entrypoint.sh:/app/clickhouse-entrypoint.sh
    environment:
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
    restart: unless-stopped

  process:
    build:
      context: .
      dockerfile: process/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    profiles: ["tools"]
    environment:
      - PGHOST=${DB_HOST:-db}
      - PGPORT=5432 # default Postgres port inside the Docker network
      - PGDATABASE=oa
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - UV_CACHE_DIR=/tmp/uv-cache
      - UV_NO_SYNC=1
      - SSC_NC_DIR=${SSC_NC_DIR:-/opt/data/SSC/nc}
      - SSC_IMAGE_DIR=${SSC_IMAGE_DIR:-/opt/data/SSC/images}
      - LO_NC_DIR=${LO_NC_DIR:-/opt/data/LO/nc}
      - LO_IMAGE_DIR=${LO_IMAGE_DIR:-/opt/data/LO/images}
      - LO_GRID_CACHE=${LO_GRID_CACHE:-/opt/data/cache/lo_grid_cache.npz}
    volumes:
      - ./shared:/app/shared
      - ./data:/opt/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  oa_db:
