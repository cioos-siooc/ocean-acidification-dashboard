services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./shared:/app/shared
      - ./data:/opt/data
      - /media/taimaz/OA/allDepths:/opt/archive
    environment:
      - SSC_NC_DIR=${SSC_NC_DIR:-/opt/data/SSC/nc}
      - SSC_NC_DIR_ARCHIVE=${SSC_NC_DIR_ARCHIVE:-/opt/archive/SSC/nc}
      - SSC_IMAGE_DIR=${SSC_IMAGE_DIR:-/opt/data/SSC/images}
      - SSC_IMAGE_DIR_ARCHIVE=${SSC_IMAGE_DIR_ARCHIVE:-/opt/archive/SSC/images}
      - EVAL_DATA_DIR=${EVAL_DATA_DIR:-/opt/data/eval}
      # ClickHouse: local docker-compose instance (db-ch service) by default
      - CH_HOST=${CH_HOST:-db-ch}
      - CH_PORT=${CH_PORT:-8123}
      - CH_USER=${CH_USER:-default}
      - CH_PASSWORD=${CH_PASSWORD:-}
      # Set CH_USE_REMOTE=true and CH_REMOTE_URL to query a remote ClickHouse instead
      - CH_USE_REMOTE=${CH_USE_REMOTE:-false}
      - CH_REMOTE_URL=${CH_REMOTE_URL:-}
      - CH_REMOTE_USER=${CH_REMOTE_USER:-}
      - CH_REMOTE_PASSWORD=${CH_REMOTE_PASSWORD:-}
      # PostHog Cloud (usage analytics); no-ops when POSTHOG_API_KEY is unset
      - POSTHOG_API_KEY=${POSTHOG_API_KEY:-}
      - POSTHOG_HOST=${POSTHOG_HOST:-https://us.i.posthog.com}
    depends_on:
      - db-ch
    restart: unless-stopped

  db-ch:
    build:
      context: .
      dockerfile: clickhouse_test/Dockerfile
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      # - ./clickhouse_data:/var/lib/clickhouse
      # - ./clickhouse_logs:/var/log/clickhouse-server
      # - ./data:/app/data
      - /home/cioos/clickhouse_data:/var/lib/clickhouse
      # - ./scripts:/app/scripts
      # - ./clickhouse-entrypoint.sh:/app/clickhouse-entrypoint.sh
    environment:
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
    restart: unless-stopped
