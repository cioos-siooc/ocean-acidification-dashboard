# Static SalishSeaCast variable/display metadata.
#
# Single source of truth for both the `api` and `process` containers (this
# file lives in shared/, mounted into both — see docker-compose.dev.yml).
# Previously this lived in Postgres (fields/datasets tables); as of the
# ClickHouse migration nothing should read that database for this anymore.
#
# precision: quantization step used by nc2tile's WebP RGB packing (see
# shared/nc2tile.py write_png_packed / process/SSC/imaging.py). This value
# is baked into every already-rendered tile — changing it without
# re-imaging makes existing tiles decode at the wrong scale client-side.
# process/SSC/config.py.VARIABLE_PRECISION is generated from this file so
# the pipeline and the API can never drift apart on it again (see the
# 2026-06 incident where a hardcoded copy in config.py fell out of sync
# with Postgres fields.precision).
#
# colormapMin / colormapMax: display range used to normalize a value onto
# the colormap (see colormaps.json) before coloring a tile — independent of
# `precision`, which only controls storage/transport quantization.
#
# LiveOcean is intentionally not covered here — it's still on the old
# Postgres-backed pipeline and out of scope for this migration.

source: SalishSeaCast

# Model domain bounding box: [min_lon, min_lat, max_lon, max_lat]. Identical
# across all 8 variables (it's a property of the grid, not the variable).
bounds: [-126.4002914428711, 46.85966491699218, -121.31835174560548, 51.10480117797852]

# Native sigma depth levels (meters), shared by every variable — process/SSC/
# ingest.py already assumes a single depth axis across variables when it
# builds its meshgrid from one variable's file and reuses it for all 8, so
# this list isn't a new assumption, just making an existing one explicit.
# depth_image is the WebP filename stem (nc2tile.py's `.` -> `p` convention).
# "bottom" is a synthetic companion level read from each variable's separate
# `_bottom.nc` file, not part of the native depth axis.
depths:
  - {depth_nc: 0.5,   depth_image: "0p5"}
  - {depth_nc: 1.5,   depth_image: "1p5"}
  - {depth_nc: 2.5,   depth_image: "2p5"}
  - {depth_nc: 3.5,   depth_image: "3p5"}
  - {depth_nc: 4.5,   depth_image: "4p5"}
  - {depth_nc: 5.5,   depth_image: "5p5"}
  - {depth_nc: 6.5,   depth_image: "6p5"}
  - {depth_nc: 7.5,   depth_image: "7p5"}
  - {depth_nc: 8.5,   depth_image: "8p5"}
  - {depth_nc: 9.5,   depth_image: "9p5"}
  - {depth_nc: 10.5,  depth_image: "10p5"}
  - {depth_nc: 11.5,  depth_image: "11p5"}
  - {depth_nc: 12.5,  depth_image: "12p5"}
  - {depth_nc: 13.5,  depth_image: "13p5"}
  - {depth_nc: 14.6,  depth_image: "14p6"}
  - {depth_nc: 15.6,  depth_image: "15p6"}
  - {depth_nc: 16.8,  depth_image: "16p8"}
  - {depth_nc: 18.0,  depth_image: "18p0"}
  - {depth_nc: 19.5,  depth_image: "19p5"}
  - {depth_nc: 21.4,  depth_image: "21p4"}
  - {depth_nc: 24.1,  depth_image: "24p1"}
  - {depth_nc: 28.2,  depth_image: "28p2"}
  - {depth_nc: 34.7,  depth_image: "34p7"}
  - {depth_nc: 44.5,  depth_image: "44p5"}
  - {depth_nc: 58.5,  depth_image: "58p5"}
  - {depth_nc: 76.6,  depth_image: "76p6"}
  - {depth_nc: 98.1,  depth_image: "98p1"}
  - {depth_nc: 121.9, depth_image: "121p9"}
  - {depth_nc: 147.1, depth_image: "147p1"}
  - {depth_nc: 173.1, depth_image: "173p1"}
  - {depth_nc: 199.6, depth_image: "199p6"}
  - {depth_nc: 226.3, depth_image: "226p3"}
  - {depth_nc: 253.1, depth_image: "253p1"}
  - {depth_nc: 279.9, depth_image: "279p9"}
  - {depth_nc: 306.8, depth_image: "306p8"}
  - {depth_nc: 333.8, depth_image: "333p8"}
  - {depth_nc: 360.7, depth_image: "360p7"}
  - {depth_nc: 387.6, depth_image: "387p6"}
  - {depth_nc: 414.5, depth_image: "414p5"}
  - {depth_nc: 441.5, depth_image: "441p5"}
  - {depth_nc: -1,    depth_image: "bottom"}

variables:
  temperature:
    unit: "°C"
    colormap: thermal
    colormapMin: 0.01
    colormapMax: 25
    precision: 0.01
  salinity:
    unit: "g/kg"
    colormap: haline
    colormapMin: 0.01
    colormapMax: 35
    precision: 0.01
  total_alkalinity:
    unit: "mmol/m³"
    colormap: thermal
    colormapMin: 500
    colormapMax: 2500
    precision: 0.1
  dissolved_oxygen:
    unit: "mmol/m³"
    colormap: oxy
    colormapMin: 0.1
    colormapMax: 450
    precision: 0.1
  dissolved_inorganic_carbon:
    unit: "mmol/m³"
    colormap: thermal
    colormapMin: 500
    colormapMax: 2500
    precision: 0.1
  ph_total:
    unit: ""
    colormap: matter
    colormapMin: 7
    colormapMax: 8.6
    precision: 0.001
  omega_arag:
    unit: ""
    colormap: thermal
    colormapMin: 0.0001
    colormapMax: 4
    precision: 0.0001
  omega_cal:
    unit: ""
    colormap: thermal
    colormapMin: 0.0001
    colormapMax: 6.5
    precision: 0.0001
