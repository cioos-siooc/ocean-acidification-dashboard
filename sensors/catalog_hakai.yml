# ERDDAP sensors, harvested by erddap_to_ch.py. Entries come from discover_erddap.py;
# load with `manage_sensors.py import` (see README "Catalog format").
sensors:
  - name: "Seawater Carbon Dioxide (CO2) Content from the Burke-o-Lator pCO2/TCO2 analyzer located at the Hakai Institute\u2019s Quadra Island Field Station, Hyacinthe Bay, BC, Canada (Research)"
    lat: 50.116
    lon: -125.222
    depth: 0.0
    api: ERDDAP
    organization: Hakai
    source_link: "https://catalogue.hakai.org/erddap/tabledap/HakaiQuadraBoLResearch"
    variables:
      omega_arag:
        code: Omega_arag
        unit: ""
        factor: 1.0
      omega_cal:
        code: Omega_calc
        unit: ""
        factor: 1.0
      ph_total:
        code: pH_T
        unit: ""
        factor: 1.0
      salinity:
        code: TSG_S
        unit: PSU
        factor: 1.0
      temperature:
        code: TSG_T
        unit: C
        factor: 1.0

  - name: "Seawater Carbon Dioxide (CO2) Content from the Burke-o-Lator pCO2/TCO2 Analyzer located at Bamfield Marine Sciences Centre, Bamfield, BC, Canada (Provisional)"
    lat: 48.836633
    lon: -125.1362667
    depth: 20
    api: ERDDAP
    organization: Hakai
    source_link: "https://catalogue.hakai.org/erddap/tabledap/HakaiBamfieldBoL5min"
    variables:
      ph_total:
        code: calcpH_Med
        unit: ""
        factor: 1.0
      salinity:
        code: TSG_S_Med
        unit: PSU
        factor: 1.0
      temperature:
        code: TSG_T_Med
        unit: C
        factor: 1.0

  - name: "Surface Seawater and Marine Boundary Layer CO2 Time Series from the Bute Inlet Ocean Observing Station (BIOOS) Buoy, Bute Inlet, BC, Canada (Research)"
    lat: 50.597
    lon: -124.899
    depth: 0.5
    api: ERDDAP
    organization: Hakai
    source_link: "https://catalogue.hakai.org/erddap/tabledap/HakaiBIOOSBuoyResearch"
    variables:
      co2_partial_pressure:
        code: pCO2_SW_sat
        unit: µatm
        factor: 1.0
      salinity:
        code: Salinity
        unit: PSU
        factor: 1.0
      temperature:
        code: SST
        unit: C
        factor: 1.0

  - name: "Surface Seawater and Marine Boundary Layer CO2 Time Series from the Kwakshua Channel (KC) Buoy, Central Coast, BC, Canada (Provisional)"
    lat: 51.6499
    lon: -127.9663
    depth: 0.5
    api: ERDDAP
    organization: Hakai
    source_link: "https://catalogue.hakai.org/erddap/tabledap/HakaiKCBuoy1hour"
    variables:
      dissolved_oxygen:  # source unit: mL/L — check factor!
        code: Oxygen_Concentration
        unit: ml/L
        factor: 1.0
      salinity:
        code: WaterSalinity
        unit: PSU
        factor: 1.0
      temperature:
        code: WaterTemp
        unit: C
        factor: 1.0

  - name: "Water Property Measurements from the Bute Inlet Ocean Observing Station (BIOOS) Wirewalker, Bute Inlet, BC, Canada (Provisional)"
    lat: 50.5744
    lon: -124.9009
    depth: -1
    api: ERDDAP
    organization: Hakai
    source_link: "https://catalogue.hakai.org/erddap/tabledap/HakaiWirewalkerProvisional"
    variables:
      depth:  # pressure axis — converted to depth at ingestion
        code: pressure
        unit: dbar
        factor: 1.0
      dissolved_oxygen:  # source unit: mL/L — check factor!
        code: dissolved_o2
        unit: ml/L
        factor: 1.0
      temperature:
        code: temperature
        unit: C
        factor: 1.0