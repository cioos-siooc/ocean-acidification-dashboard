# DFO MEDS / ECCC moored buoys — sea surface temperature
#
# One ERDDAP dataset (DFO_MEDS_BUOYS) holds every station, so each sensor here
# points at the same `source_link` and is separated by a `constraints:` line
# (`STN_ID="..."`). `SSTP_UQL<=2` keeps only UNESCO QC levels 1-2 (good /
# probably good), which drops ~2% of rows.
#
# Depth is 0: the dataset's `water_depth` column is the seabed depth under the
# mooring, not the depth of the measurement.
#
# Archive only — the newest record on the server is 2025-03-18. `SSTP` is the
# sole variable here that maps onto the app's registry; wind, air pressure and
# wave height are in the dataset but have no ocean-variable equivalent.
#
# The station IDs are the names; rename them if you want the buoys' common
# names in the UI.
#
#   uv run python manage_sensors.py import --file catalog_dfo_meds.yml
#   uv run python erddap_to_ch.py --sensor-id <uuid>
sensors:
  - name: "C46036"
    lat: 48.35
    lon: -133.94
    depth: 0
    api: ERDDAP
    organization: DFO MEDS
    source_link: "https://data.cioospacific.ca/erddap/tabledap/DFO_MEDS_BUOYS"
    constraints: 'STN_ID="C46036"&SSTP_UQL<=2'
    description: "Offshore Pacific — outside the SalishSeaCast domain"
    variables:
    - "temperature:SSTP:C:1.0"

