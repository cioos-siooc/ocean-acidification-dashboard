    variables:
      # The AML CTD (C1) and Aanderaa optode (O1) have been in since 2016; the
      # Water Quality Monitor ended 2017-01 and the Sea-Bird pair (C2, O2) ran
      # only 2017-01 to 2018-01. They agree to ~0.03 °C where they overlap.
      chlorophyll:
        unit: µg/L
        factor: 1.0
        sources:
        - CRIP/FLUOROMETER/chlorophyll
        - CRIP/WETLABS_WQM/chlorophyll
      dissolved_oxygen:
        unit: ml/L
        factor: 44.66
        sources:
        - CRIP.O1/OXYSENSOR/oxygen_corrected
        - CRIP.O2/OXYSENSOR/oxygen_corrected
        - CRIP/WETLABS_WQM/oxygen
      salinity:
        unit: PSU
        factor: 1.0
        sources:
        - CRIP.C1/CTD/salinity
        - CRIP.C2/CTD/salinity
        - CRIP/WETLABS_WQM/salinity
      temperature:
        unit: C
        factor: 1.0
        sources:
        - CRIP.C1/CTD/temperature
        - CRIP.C2/CTD/temperature
