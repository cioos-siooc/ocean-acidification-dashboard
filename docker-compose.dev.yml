services:
  front:
    build:
      target: development
      context: ./front
      args:
        - NUXT_PUBLIC_API_BASE_URL=${NUXT_PUBLIC_API_BASE_URL:-http://localhost:9011}
        - NUXT_PUBLIC_VERSION=${NUXT_PUBLIC_VERSION:-unknown}
    ports:
      - "${FRONT_PORT:-3000}:3000"
    volumes:
      - ./front:/app
      - /app/node_modules
    environment:
      - NUXT_PUBLIC_API_BASE_URL=${NUXT_PUBLIC_API_BASE_URL:-http://localhost:9011}
      - NUXT_PUBLIC_VERSION=${NUXT_PUBLIC_VERSION:-unknown}
    depends_on:
      - api
    env_file:
      - .env.dev
    command: npm run dev
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    volumes:
      - ./api:/app
      - ./shared:/app/shared
      - ./data:/opt/data
    ports:
      - "${API_PORT:-4000}:4000"
    env_file:
      - .env.dev
    environment:
      - HDF5_USE_FILE_LOCKING=FALSE
      - SSC_NC_DIR=${SSC_NC_DIR:-/opt/data/SSC/nc}
      - SSC_IMAGE_DIR=${SSC_IMAGE_DIR:-/opt/data/SSC/images}
      # ClickHouse: local docker-compose instance (db-ch service) by default
      - CH_HOST=${CH_HOST:-db-ch}
      - CH_PORT=${CH_PORT:-8123}
      - CH_USER=${CH_USER:-default}
      - CH_PASSWORD=${CH_PASSWORD:-${CLICKHOUSE_PASSWORD:-}}
      # Set CH_USE_REMOTE=true and CH_REMOTE_URL to query a remote ClickHouse instead
      - CH_USE_REMOTE=${CH_USE_REMOTE:-false}
      - CH_REMOTE_URL=${CH_REMOTE_URL:-}
      - CH_REMOTE_USER=${CH_REMOTE_USER:-}
      - CH_REMOTE_PASSWORD=${CH_REMOTE_PASSWORD:-}
      # PostHog Cloud (usage analytics); no-ops when POSTHOG_API_KEY is unset
      - POSTHOG_API_KEY=${POSTHOG_API_KEY:-}
      - POSTHOG_HOST=${POSTHOG_HOST:-https://us.i.posthog.com}
    depends_on:
      - db-ch
    command: uvicorn SERVER:app --reload --host 0.0.0.0 --port 4000
    restart: unless-stopped

  db-ch:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "9013:8123"
      - "9014:9000"
    volumes:
      - ./clickhouse/data:/var/lib/clickhouse
      - ./clickhouse/logs:/var/log/clickhouse-server
      - ./clickhouse/users.d:/etc/clickhouse-server/users.d
    environment:
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sensors:
    build:
      context: .
      dockerfile: sensors/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env.dev
    environment:
      # Override the host-IP values in .env.dev with the Docker service name/port,
      # and clear CH_PASSWORD (local dev db-ch has no password)
      - CH_HOST=db-ch
      - CH_PORT=8123
      - CH_PASSWORD=
    # volumes:
    #   - ./sensors:/app
    #   - ./shared:/app/shared
    depends_on:
      db-ch:
        condition: service_healthy

  process: &process
    build:
      context: .
      dockerfile: process/Dockerfile
    # profiles: ["tools"]
    env_file:
      - .env.dev
    environment:
      - SSC_NC_DIR=${SSC_NC_DIR:-/opt/data/SSC/nc}
      - SSC_IMAGE_DIR=${SSC_IMAGE_DIR:-/opt/data/SSC/images}
    volumes:
      - ./process:/app
      - ./shared:/app/shared
      - ./data/.:/opt/data
    depends_on:
      db-ch:
        condition: service_healthy

  # --- Prefect: schedule + run-history UI for the SSC pipeline's `run` ------
  # UI at http://localhost:${PREFECT_PORT:-9015}. The schedule opens PAUSED in
  # dev: .env.dev points CH_USE_REMOTE at the production ClickHouse, so a
  # scheduled dev run would advance the real SalishSeaCast_status table.
  # Trigger ad-hoc runs from the UI ("Run" → custom parameters) instead, or set
  # RUN_SCHEDULE_PAUSED=false deliberately.
  prefect:
    # Must match the `prefect==` pin in process/pyproject.toml.
    image: prefecthq/prefect:${PREFECT_IMAGE_TAG:-3.8.6-python3.13}
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    ports:
      - "${PREFECT_PORT:-9015}:4200"
    volumes:
      # SQLite database + server state. Not /opt/prefect: the image keeps its
      # entrypoint.sh there, and a mount over it breaks startup.
      - prefect-data:/var/lib/prefect
    environment:
      PREFECT_HOME: /var/lib/prefect
      # Never blank: Prefect treats "" as a password of "" rather than "no
      # auth", and every client call then 401s.
      PREFECT_SERVER_API_AUTH_STRING: ${PREFECT_AUTH_STRING:-admin:admin}
      # What the BROWSER calls. Without it the UI points at 0.0.0.0:4200.
      PREFECT_UI_API_URL: ${PREFECT_PUBLIC_URL:-http://localhost:9015}/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    healthcheck:
      # /api/health is exempt from the auth string.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # The `process` image serving SSC/flows.py to `prefect` instead of idling.
  scheduler:
    <<: *process
    command: ["uv", "run", "--no-dev", "python", "-m", "SSC.flows"]
    environment:
      - SSC_NC_DIR=${SSC_NC_DIR:-/opt/data/SSC/nc}
      - SSC_IMAGE_DIR=${SSC_IMAGE_DIR:-/opt/data/SSC/images}
      - PREFECT_API_URL=http://prefect:4200/api
      - PREFECT_API_AUTH_STRING=${PREFECT_AUTH_STRING:-admin:admin}
      - PREFECT_LOGGING_EXTRA_LOGGERS=SalishSeaCast,nc2tile
      - PREFECT_HOME=/tmp/prefect
      - RUN_CRON=${RUN_CRON:-0 */3 * * *}
      - RUN_SCHEDULE_PAUSED=${RUN_SCHEDULE_PAUSED:-true}
    depends_on:
      db-ch:
        condition: service_healthy
      prefect:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prefect-data:
