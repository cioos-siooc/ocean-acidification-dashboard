services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./shared:/app/shared
      - /home/cioos/OA_data:/opt/data
      # Optional deep-archive mount (older data outside the normal retention
      # window) — uncomment and set ARCHIVE_DIR once this machine actually
      # has that storage; SSC_*_ARCHIVE below are no-ops without it.
      # - ${ARCHIVE_DIR}:/opt/archive
    environment:
      - SSC_NC_DIR=${SSC_NC_DIR:-/opt/data/SSC/nc}
      - SSC_NC_DIR_ARCHIVE=${SSC_NC_DIR_ARCHIVE:-/opt/archive/SSC/nc}
      - SSC_IMAGE_DIR=${SSC_IMAGE_DIR:-/opt/data/SSC/images}
      - SSC_IMAGE_DIR_ARCHIVE=${SSC_IMAGE_DIR_ARCHIVE:-/opt/archive/SSC/images}
      - LO_NC_DIR=${LO_NC_DIR:-/opt/data/LO/nc}
      - LO_IMAGE_DIR=${LO_IMAGE_DIR:-/opt/data/LO/images}
      # Bathymetry contour vector tiles (GET /vector/{z}/{x}/{y}.pbf), built by
      # scripts/bathymetry.sh. Default points at the old NONNA output; set
      # VECTOR_ROOT to override for a different source (e.g. west coast DEM).
      - VECTOR_ROOT=${VECTOR_ROOT:-/opt/data/bathymetry/NONNA/tiles}
      # ClickHouse: local docker-compose instance (db-ch below) by default
      - CH_HOST=${CH_HOST:-db-ch}
      - CH_PORT=${CH_PORT:-8123}
      - CH_USER=${CH_USER:-default}
      - CH_PASSWORD=${CH_PASSWORD:-}
      # Set CH_USE_REMOTE=true and CH_REMOTE_URL to query a remote ClickHouse instead
      - CH_USE_REMOTE=${CH_USE_REMOTE:-false}
      - CH_REMOTE_URL=${CH_REMOTE_URL:-}
      - CH_REMOTE_USER=${CH_REMOTE_USER:-}
      - CH_REMOTE_PASSWORD=${CH_REMOTE_PASSWORD:-}
      # SSC sync stage (process/SSC/sync.py on the PROCESS machine): staging
      # dir the rsynced Native-format export lands in, and the bearer token
      # POST /admin/syncHourly is checked against. SYNC_API_TOKEN must
      # exactly match the PROCESS machine's .env.process.remote — previously
      # missing here entirely, which made every sync attempt 401.
      - SSC_SYNC_STAGING_DIR=${SSC_SYNC_STAGING_DIR:-/opt/data/SalishSeaCast/sync_staging}
      - SYNC_API_TOKEN=${SYNC_API_TOKEN:?Set SYNC_API_TOKEN to the same value as the PROCESS machine's .env.process.remote}
      # PostHog Cloud (usage analytics); no-ops when POSTHOG_API_KEY is unset
      - POSTHOG_API_KEY=${POSTHOG_API_KEY:-}
      - POSTHOG_HOST=${POSTHOG_HOST:-https://us.i.posthog.com}
    depends_on:
      db-ch:
        condition: service_healthy
    restart: unless-stopped

  # Sensor ingestion — fetches from ONC/ERDDAP and writes directly to db-ch.
  # Run on demand (manual); scheduled runs are sensors-scheduler's job.
  # Example: docker compose -f docker-compose.prod.api.yml run --rm sensors python onc_to_ch.py
  sensors:
    build:
      context: .
      dockerfile: sensors/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - CH_HOST=${CH_HOST:-db-ch}
      - CH_PORT=${CH_PORT:-8123}
      - CH_USER=${CH_USER:-default}
      - CH_PASSWORD=${CH_PASSWORD:-}
      - CH_USE_REMOTE=${CH_USE_REMOTE:-false}
      - CH_REMOTE_URL=${CH_REMOTE_URL:-}
      - ONC_TOKEN=${ONC_TOKEN:-}
    depends_on:
      db-ch:
        condition: service_healthy

  # The sensors image serving sensors/flows.py: a long-running container that
  # polls the shared Prefect server (PREFECT_API_URL, basic auth via
  # PREFECT_AUTH_STRING) and runs each scheduled ERDDAP/ONC ingestion
  # in-process — deployments OceanECO-sensors-ERDDAP (ERDDAP_CRON, default on
  # the hour) and OceanECO-sensors-ONC (ONC_CRON, default half past). Replaces
  # the host cron running erddap_to_ch.py / onc_to_ch.py: keep only one, or
  # the two overlap. A code update means rebuilding/recreating this service.
  #
  # Stopping it pauses the schedule; starting it re-applies
  # SENSORS_SCHEDULE_PAUSED — so the UI's pause toggle lasts only until the
  # next restart.
  sensors-scheduler:
    build:
      context: .
      dockerfile: sensors/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    command: ["uv", "run", "--no-sync", "python", "flows.py"]
    environment:
      - CH_HOST=${CH_HOST:-db-ch}
      - CH_PORT=${CH_PORT:-8123}
      - CH_USER=${CH_USER:-default}
      - CH_PASSWORD=${CH_PASSWORD:-}
      - CH_USE_REMOTE=${CH_USE_REMOTE:-false}
      - CH_REMOTE_URL=${CH_REMOTE_URL:-}
      - ONC_TOKEN=${ONC_TOKEN:-}
      # Required, no default: a fallback URL turns a missing --env-file into a
      # restart loop of opaque "All connection attempts failed" errors.
      - PREFECT_API_URL=${PREFECT_API_URL:?set PREFECT_API_URL (e.g. https://prefect.cioospacific.ca/api) — did you pass --env-file?}
      # The server's basic auth (user:password). Blank sends none.
      - PREFECT_API_AUTH_STRING=${PREFECT_AUTH_STRING:-}
      # The container runs as the host UID, whose home isn't writable here.
      - PREFECT_HOME=/tmp/prefect
      - ERDDAP_CRON=${ERDDAP_CRON:-0 * * * *}
      - ONC_CRON=${ONC_CRON:-30 * * * *}
      - SENSORS_SCHEDULE_PAUSED=${SENSORS_SCHEDULE_PAUSED:-false}
    depends_on:
      db-ch:
        condition: service_healthy
    restart: unless-stopped

  # Canonical ClickHouse — receives the PROCESS machine's synced
  # SalishSeaCast_hourly data (see api/modules/sync_hourly.py) and serves
  # extractTimeseries/analysis queries. Not the same as the PROCESS
  # machine's own db-ch, which only tracks that machine's pipeline status.
  db-ch:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ${CH_DATA_DIR:-/home/cioos/clickhouse_data}:/var/lib/clickhouse
    environment:
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
